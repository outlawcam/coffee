<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stancraft Coffee Co</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: var(--paper-100); color: var(--ink-900); overflow-x: hidden; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  ::selection { background: var(--ink-900); color: var(--paper-100); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Broadsheet shell ---------- */
  /* Left-rail nav links: underline-on-hover, ink → oxblood. */
  .bs-navlink { transition: color var(--dur) var(--ease-standard), padding-left var(--dur) var(--ease-standard); }
  .bs-navlink:hover { color: var(--accent) !important; padding-left: 8px; }
  .bs-social { transition: background var(--dur) var(--ease-standard), color var(--dur) var(--ease-standard); }
  .bs-social:hover { background: var(--ink-900); color: var(--paper-100) !important; }

  /* Broadsheet text-buttons */
  .bs-btn { transition: background var(--dur) var(--ease-standard), color var(--dur) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }
  .bs-btn-solid:hover { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--paper-100) !important; }
  .bs-btn-line:hover { color: var(--accent) !important; border-color: var(--accent) !important; }
  .bs-btn:active { transform: translateY(1px); }

  /* Design-system + legacy hooks, re-skinned square/ink for the broadsheet. */
  .btn-primary, .btn-outline, .btn-outline-light, .btn-gold { transition: background var(--dur) var(--ease-standard), border-color var(--dur) var(--ease-standard), color var(--dur) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }
  .btn-primary:hover { background: var(--accent) !important; border-color: var(--accent) !important; }
  .btn-outline:hover { background: var(--ink-900) !important; color: var(--paper-100) !important; }
  .btn-outline-light:hover { background: var(--paper-100) !important; color: var(--dark-900) !important; }
  .btn-gold:hover { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--paper-100) !important; }
  .btn-primary:active, .btn-outline:active, .btn-outline-light:active, .btn-gold:active { transform: translateY(1px); }

  .link-accent { transition: color var(--dur) var(--ease-standard); }
  .link-accent:hover { color: var(--accent-hover) !important; }
  .link-footer { transition: color var(--dur) var(--ease-standard); }
  .link-footer:hover { color: var(--accent) !important; }
  .link-footer:hover span { border-color: var(--accent) !important; }
  .brewpill:hover { border-color: var(--ink-900) !important; }

  /* ---------- Responsive ---------- */
  img { max-width: 100%; }
  input, select, textarea, button { box-sizing: border-box; }
  image-slot { display: block; width: 100%; height: 100%; }
  /* Rail width must INCLUDE its padding + border so .bs-main's matching
     margin-left lines up (otherwise the rail overlaps the content). */
  .bs-rail, .bs-topbar { box-sizing: border-box; }
  /* Broadsheet has no pills — square the brew-method filters. */
  .brewpill { border-radius: 0 !important; }

  /* Products are batch labels: 2-up (a sheet of labels), 1-up when narrow. */
  @media (max-width: 760px) { .grid-products { grid-template-columns: 1fr !important; } }
  /* The maker's seal tucks smaller / out of the way on narrow screens. */
  @media (max-width: 900px) { .bs-seal { width: 96px !important; height: 96px !important; } }
  @media (max-width: 640px) { .bs-seal { display: none; } }

  /* Below the breakpoint the rail goes off-canvas; a top bar drives it. */
  @media (max-width: 860px) {
    .bs-rail { width: var(--rail-w) !important; transform: translateX(-100%); transition: transform 280ms var(--ease-standard); box-shadow: 0 0 0 100vmax rgba(0,0,0,0); }
    .bs-rail.open { transform: translateX(0); }
    .bs-main { margin-left: 0 !important; }
    .bs-topbar { display: flex !important; }
  }

  /* Masthead + lead stack on narrow screens */
  @media (max-width: 820px) {
    .bs-flag { grid-template-columns: 1fr !important; }
    .bs-flag-side { display: none !important; }
    .bs-lead { grid-template-columns: 1fr !important; }
    .bs-lead > div { border-right: none !important; padding: 30px 22px 34px !important; }
    .bs-lead-cut { order: -1; min-height: 240px !important; border-bottom: 1px solid var(--ink-900); }
  }
  @media (max-width: 520px) {
    .bs-dateline-mid { display: none; }
  }
  @media (max-width: 768px) {
    .sect { padding: 56px 22px !important; }
    .foot-inner { padding: 52px 22px 32px !important; }
    .grid-split { grid-template-columns: 1fr !important; }
    .grid-3 { grid-template-columns: 1fr !important; }
    .h2 { font-size: 30px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
